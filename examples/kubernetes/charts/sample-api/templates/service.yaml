apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Chart.Name }}
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sample-api.labels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http   # the named container port in deployment.yaml
