# ---------------------------------------------------------------------------
# Grafana
#   Dashboards behind the reverse proxy at /grafana.
#   Requires: a .env next to this file with GF_ADMIN_PASSWORD.
#
#   docker compose up -d
# ---------------------------------------------------------------------------

services:
  grafana:
    container_name: grafana
    restart: unless-stopped
    image: grafana/grafana:11.1.0

    expose:
      - 3000

    environment:
      TZ: Europe/Berlin

      # Base URL when routed via the reverse proxy
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Generate: openssl rand -base64 24
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      # Dashboards and data sources from the repo
      - ./provisioning:/etc/grafana/provisioning:ro

      # Grafana database and plugins, in .gitignore
      - ./data:/var/lib/grafana
